<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d2b24" />
  <meta name="description" content="登录观澜投研研究台" />
  <title>登录 · 观澜投研</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d2b24'/%3E%3Cpath d='M12 40c6-12 12-12 18 0s12 12 22-2' stroke='%23d5e97a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <main class="login-layout">
    <section class="login-story" aria-label="观澜投研介绍">
      <div class="story-grid" aria-hidden="true"></div>
      <a class="brand" href="/login" aria-label="观澜投研">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 14c3.2-6.5 6.3-6.5 9.5 0s6.3 6.5 10.5-1M2 8c3.2-6.5 6.3-6.5 9.5 0S17.8 14.5 22 7"/></svg>
        </span>
        <span><strong>观澜投研</strong><small>GUANLAN RESEARCH</small></span>
      </a>

      <div class="story-copy">
        <p class="eyebrow">PRIVATE RESEARCH DESK</p>
        <h1>看清市场脉络，<br />再做每一次判断。</h1>
        <p class="story-lead">行情、资金、研报与技术信号汇于一处，为每一次研究留出更清晰的视野。</p>
        <div class="signal-card" aria-hidden="true">
          <div class="signal-head"><span>MARKET SIGNAL</span><b>研究视野</b></div>
          <svg viewBox="0 0 520 150" preserveAspectRatio="none">
            <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e97a" stop-opacity=".34"/><stop offset="1" stop-color="#d5e97a" stop-opacity="0"/></linearGradient></defs>
            <path class="area" d="M0 123C42 118 58 92 94 99s50 25 84 4 55-69 93-55 45 54 82 39 49-53 83-41 43 50 84 19v85H0Z"/>
            <path class="line" d="M0 123C42 118 58 92 94 99s50 25 84 4 55-69 93-55 45 54 82 39 49-53 83-41 43 50 84 19"/>
          </svg>
          <div class="signal-meta"><span><i></i> 多维数据聚合</span><span>仅限授权访问</span></div>
        </div>
      </div>

      <p class="story-foot">市场有风险，研究应保持独立判断。</p>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="mobile-brand" aria-hidden="true">
          <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M2 14c3.2-6.5 6.3-6.5 9.5 0s6.3 6.5 10.5-1M2 8c3.2-6.5 6.3-6.5 9.5 0S17.8 14.5 22 7"/></svg></span>
          <strong>观澜投研</strong>
        </div>
        <p class="form-kicker">WELCOME BACK</p>
        <h2>登录研究台</h2>
        <p class="form-intro">请输入授权账号，继续访问市场全景与个股研究。</p>

        <form id="loginForm" novalidate>
          <label class="field">
            <span>账号</span>
            <div class="input-shell">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
              <input id="account" name="account" type="text" inputmode="numeric" autocomplete="username" maxlength="80" placeholder="请输入账号" required autofocus />
            </div>
          </label>

          <label class="field">
            <span>密码</span>
            <div class="input-shell">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" placeholder="请输入密码" required />
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.1A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-2.1 2.7M6.6 6.7C4 8.4 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.8-.4 4-.9M9.9 9.8a3 3 0 0 0 4.2 4.3"/></svg>
              </button>
            </div>
          </label>

          <div class="form-options">
            <label class="remember"><input id="remember" type="checkbox" /><span></span>7 天内保持登录</label>
            <span>安全加密验证</span>
          </div>

          <p class="form-error" id="formError" role="alert" aria-live="polite"></p>
          <button class="submit-button" id="submitButton" type="submit">
            <span>进入研究台</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
            <i class="spinner" aria-hidden="true"></i>
          </button>
        </form>

        <div class="security-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3 7.8 7.5 9.5 4.5-1.7 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>凭据在服务端校验，密码不会保存在浏览器中。</span>
        </div>
      </div>
      <p class="panel-foot">© 2026 观澜投研 · 内部研究系统</p>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
