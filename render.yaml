services:
  - type: web
    name: guanlan-stocklens
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: STOCKLENS_DATA_DIR
        value: /var/data/stocklens
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        sync: false
    disk:
      name: stocklens-data
      mountPath: /var/data
      sizeGB: 1
